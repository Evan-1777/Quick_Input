name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: MyGo vet
        run: go tool mygo vet

      - name: Build Windows binary
        run: go tool mygo build -platform windows/amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-input-windows-amd64
          path: build/windows-amd64/Quick Input.exe
          if-no-files-found: error

      - name: Publish acceptance checklist
        shell: pwsh
        run: |
          @'
          ### Windows 11 验收核对
          - [ ] 双击 Quick Input.exe 唤醒已运行实例并打开管理窗口
          - [ ] 快捷键唤出悬浮窗，再按一次收起；焦点回到原应用
          - [ ] 设置页切换唤出快捷键后立即生效，重启后保持；被占用时保留原组合并提示
          - [ ] 托盘右键菜单可新建预设文本、打开管理窗口与退出，退出可结束进程
          - [ ] 选中预设文本后粘贴到原输入框，剪贴板文本恢复（期间未复制新内容）
          - [ ] 搜索、分组单选、标签多选交集与上下键循环选择正确
          - [ ] 100% / 125% / 150% 缩放下悬浮窗居中于光标所在显示器且不越界
          - [ ] 批量移入分组、批量增删标签、删除前二次确认均生效
          '@ >> $env:GITHUB_STEP_SUMMARY

  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: quick-input-windows-amd64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/Quick Input.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quick Input $TAG" \
            --notes "0.2.0：前端重构为 MyGo 原生 UI 与紧凑 Material 3 风格，不再依赖 WebView；新增设置页可切换唤出快捷键并持久化，注册失败时回退并提示；键入前校验目标窗口。全局热键唤出悬浮面板，按分组与标签检索预设文本并直接键入原输入位置；系统托盘常驻，支持批量管理与分类维护。下载后直接运行，需要 Windows 11 x64。"
